<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23f0a500'/%3E%3Ctext x='50' y='68' font-size='55' font-family='Arial,sans-serif' font-weight='800' fill='%230d0d0d' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Page Not Found — Apna Typing Master Pro</title>
<style>
  .nf-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;padding:24px;}
  .nf-logo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:800;
    font-size:22px;margin-bottom:40px;cursor:pointer;}
  .nf-logo .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .nf-logo span{color:var(--accent);}
  .nf-code{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(70px,15vw,140px);line-height:1;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;}
  .nf-title{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(20px,4vw,28px);margin:12px 0 10px;}
  .nf-desc{color:var(--muted);max-width:440px;margin:0 auto 32px;font-size:15px;line-height:1.6;}
  .nf-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .nf-btn{padding:13px 26px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;
    font-family:'DM Sans',sans-serif;text-decoration:none;transition:all .2s;display:inline-block;}
  .nf-btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0d0d0d;border:none;}
  .nf-btn-primary:hover{transform:translateY(-2px);}
  .nf-btn-secondary{background:transparent;color:var(--text);border:1.5px solid var(--border);}
  .nf-btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>
  <div class="nf-wrap">
    <div class="nf-logo" onclick="location.href='index.html'">
      <div class="logo-icon">⌨</div>
      Apna Typing <span>Master</span> Pro
    </div>
    <div class="nf-code">404</div>
    <div class="nf-title">Ye page nahi mila</div>
    <p class="nf-desc">Jis page ko aap dhundh rahe hain wo hata diya gaya hai, move ho gaya hai, ya link galat hai. Chinta na karein — chaliye aapko wapas sahi jagah le chalte hain.</p>
    <div class="nf-actions">
      <a href="index.html" class="nf-btn nf-btn-primary">← Home par jaayein</a>
      <a href="candidate.html" class="nf-btn nf-btn-secondary">Dashboard kholein</a>
    </div>
  </div>
</body>
</html>
